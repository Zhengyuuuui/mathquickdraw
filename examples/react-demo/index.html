<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- apple-* is deprecated; keep both so older iOS and other browsers agree. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <title>AI 数学手写答题</title>
  <style>html, body, #root { margin: 0; height: 100%; }</style>
</head>
<body>
  <div id="root"></div>
  <!-- Machine-readable context for the external grading agent. Filled by
       App.tsx on every phase change; one DOM query gives an agent the page
       id, URL, formula, API base and the prompt to follow. Never holds a
       token — prompts get screenshotted. -->
  <script type="application/json" data-testid="agent-context" id="agent-context"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
